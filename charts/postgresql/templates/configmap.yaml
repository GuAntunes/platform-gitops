{{- if and .Values.postgresql.initScript .Values.postgresql.initScriptSql }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql.fullname" . }}-init-script
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
data:
  init-db.sql: |
{{ .Values.postgresql.initScriptSql | nindent 4 }}
{{- end }}
